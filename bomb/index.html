<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>炸弹人</title>
	<style type="text/css">
		body{margin:10px;background-color:#f6ddae;background-image:repeating-linear-gradient(45deg,transparent,transparent 35px,rgba(255,255,255,.5) 35px,rgba(255,255,255,.5) 70px);background-attachment:fixed;font-family:Arial Black;}body,a{color:#325128;}h1{color:#f6ddae; margin-top: 5px; margin-bottom: 0px;}div{margin:0px auto;width:850px;text-align:center;}#box{background-color:#003100;padding-top: 5px;padding-bottom: 10px;border-radius: 25px;box-shadow: 5px 5px 10px #333;}

<body>
	<div id="box">
		<h1>炸弹人</h1>
		<canvas id="c" width="800" height="480"></canvas>
		<div style="color:#f6ddae">按 m 打开/关闭音乐</div>
	</div>
	<div style="font-size: 0.8em">
