<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <title>积木切切乐</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2c3f51"><link rel="stylesheet" href="style.css">
    
    <script type="text/javascript" src="../public.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4725615404219961" crossorigin="anonymous"></script>
    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

<body>
<!-- partial:index.partial.html -->
<!-- Game canvas -->
<canvas id="c"></canvas>

<!-- Gameplay HUD -->
<div class="hud">
	<div class="hud__score">
		<div class="score-lbl"></div>
		<div class="cube-count-lbl"></div>
	</div>
	<div class="pause-btn"><div></div></div>
	<div class="slowmo">
		<div class="slowmo__bar"></div>
	</div>
</div>

<!-- Menu System -->
<div class="menus">
	<div class="menu menu--main">
		<h1>积木切切乐</h1>
		<button type="button" class="play-normal-btn">开始游戏</button>
		<button type="button" class="play-casual-btn">休闲模式</button>
		<!--<div class="credits">An 8kB game by <a href="https://cmiller.tech">Caleb Miller</a></div>-->
		<div class="credits"><a href="../index.html">更多小游戏</a></div>
	</div>
	<div class="menu menu--pause">
		<h1>已暂停</h1>
		<button type="button" class="resume-btn">继续游戏</button>
		<button type="button" class="menu-btn--pause">回主菜单</button>
	</div>
	<div class="menu menu--score">
		<h1>游戏结束</h1>
		<h2>分数</h2>
		<div class="final-score-lbl"></div>
		<div class="high-score-lbl"></div>
		<button type="button" class="play-again-btn">再玩一次</button>
		<button type="button" class="menu-btn--score">回主菜单</button>
	</div>
</div>
<!-- partial -->
<script  src="script.js@v=1"></script>

</body>
</html>
